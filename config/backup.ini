[backup]
enabled = true
interval_hours = 6
keep_daily = 7
keep_weekly = 4
keep_monthly = 3
before_upgrade = true
before_migration = true
before_restore = true
include_config = true
include_memory = false

[retention]
task_artifacts_days = 90
logs_days = 30
metrics_days = 30
events_days = 180
failed_task_artifacts_days = 180

[logs]
max_size_mb = 50
keep_files = 10
compress = true
