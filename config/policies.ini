# AgentBox v5.0-beta3 — policies.ini (seeded to ~/.config/agentbox-v5/policies.ini)
# Effects: allow | deny | approval | audit

[filesystem]
workspace_only = true
allow_delete = approval
allow_system_write = false
secret_files = deny
write = allow
read = allow
create = allow

[git]
commit = allow
merge = approval
push = approval
force_push = deny
delete_branch = approval

[network]
outbound = allow
unknown_domains = approval

[packages]
install = approval
remove = approval

[docker]
enabled = true
privileged = deny
host_network = deny
bind_system_paths = deny
run = allow
build = allow

[database]
migration = approval
destructive_migration = deny

[deployment]
production = approval
staging = allow

[agent]
delegate = allow

[run]
before_run = allow

[approvals]
risk_threshold = 60
critical_threshold = 80
